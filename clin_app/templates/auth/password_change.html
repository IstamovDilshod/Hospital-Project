{% extends 'base.html' %}
{% block title %}Parolni almashtirish{% endblock %}
{% block content %}
<div class="card auth-box">
  <h1>Parolni almashtirish</h1>
  {% if user.must_change_password %}
    <div class="alert alert-error">
      Siz vaqtinchalik parol bilan kirdingiz. Davom etish uchun yangi parol o'rnating.
    </div>
  {% endif %}
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">Saqlash</button>
  </form>
</div>
{% endblock %}
