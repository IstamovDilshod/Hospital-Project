{% extends 'base.html' %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="card auth-box">
  <h1>Tizimga kirish</h1>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">Kirish</button>
  </form>
  <p class="small center muted" style="margin-top:14px">
    Parolni unutdingizmi? Registraturaga murojaat qiling, sizga vaqtinchalik parol beriladi.
  </p>
  <p class="small center muted" style="margin-top:16px">Akkaunt yo'qmi?
    <a href="{% url 'register' %}" class="teal" style="font-weight:700">Ro'yxatdan o'ting</a></p>
</div>
{% endblock %}
