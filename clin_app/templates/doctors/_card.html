<a href="{% url 'doctor_detail' doctor.pk %}" class="card">
  <div class="doctor-head">
    {% if doctor.photo %}
      <img src="{{ doctor.photo.url }}" class="avatar" alt="">
    {% else %}
      <div class="avatar"><svg class="icon"><use href="#i-user"/></svg></div>
    {% endif %}
    <div>
      <div class="doctor-name">{{ doctor.user.get_full_name|default:doctor.user.username }}</div>
      <div class="teal small" style="font-weight:700">{{ doctor.specialty }}</div>
    </div>
  </div>
  <div class="doctor-meta">
    <div class="row"><svg class="icon"><use href="#i-building"/></svg> {{ doctor.hospital.name }}</div>
    <div class="row"><svg class="icon"><use href="#i-briefcase"/></svg> Tajriba: {{ doctor.experience_years }} yil</div>
    <div class="row"><svg class="icon"><use href="#i-wallet"/></svg> {{ doctor.price }} so'm</div>
  </div>
</a>
